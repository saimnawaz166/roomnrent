    <script>
      // Applied before React mounts so there's no light-flash on reload when
      // the user has dark mode saved.
      (function () {
        try {
          var saved = localStorage.getItem('roomnrent-theme');
          var theme = saved === 'dark' || saved === 'light' ? saved : 'light';
          if (theme === 'dark') document.documentElement.classList.add('dark');
        } catch {
          /* localStorage unavailable — default to light */
        }
      })();
    </script>
